name: workflow.yml
on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      #1. Clone repository
      - name: Checkout Code
        uses: actions/checkout@v4

      #2. Install Java 25
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      #3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      #4. Install Frontend Dependencies & Verify Angular Build
      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Frontend
        run: npm run webapp:build:prod

      #5. Compile and Test Spring Boot Backend
      - name: Compile and Test Backend
        run: ./mvnw test -P-webapp
